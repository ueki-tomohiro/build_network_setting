name: app
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  external_todo:
    path: ../api/external/todo

  cupertino_icons: ^2.0.0
  riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  flutter_hooks: ^0.21.3+1
  hooks_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  flutter_flavor: ^3.1.1
  go_router: ^18.0.2
  bot_toast: ^4.0.3
  logger: ^2.8.0

  mock_setting:
    path: ../mock_setting

dev_dependencies:
  build_runner:

  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mockito: ^5.3.2
  freezed: ^4.0.1
  riverpod_generator: ^4.0.9
  cider: ^0.2.10

flutter:

  uses-material-design: true

cider:
  link_template:
    tag: https://github.com/ueki-tomohiro/build_network_setting/releases/tag/%tag% # initial release link template
    diff: https://github.com/ueki-tomohiro/build_network_setting/compare/%from%...%to% # subsequent releases link template
