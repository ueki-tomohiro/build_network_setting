# 依存パッケージのビルドスクリプトは明示的に許可したものだけ実行する
allowBuilds:
  # postinstall は opencollective の寄付表示のみ（generator jar は実行時に取得される）
  '@openapitools/openapi-generator-cli': false
  # postinstall は Scarf の利用状況テレメトリ送信
  '@scarf/scarf': false

overrides:
  js-yaml: ^3.15.2
  lodash: ^4.18.1
  picomatch@>=2 <2.3.2: ^2.3.2
  ajv-formats>ajv: ^8.20.0
  "@apidevtools/swagger-parser>ajv": ^8.20.0
  postman-collection>uuid: ^11.1.1
